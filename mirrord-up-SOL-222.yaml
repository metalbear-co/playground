# SOL-222 MetalMart V2 — run from the playground repo root:
#   mirrord up -f mirrord-up-SOL-222.yaml --key <session-key>
# Split mode everywhere: only requests / Kafka messages carrying
# `baggage: mirrord-session=<key>` reach the local processes.
services:
  inventory-service:
    target: { path: deployment/inventory-service, namespace: shop }
    http_filter:
      header_filter: 'baggage:\s*[^\n]*\bmirrord-session={{ key }}\b'
    env:
      override:
        PORT: "8081"                     # local port; container listens on 80
    config_patch:
      feature:
        network:
          incoming:
            port_mapping: [[8081, 80]]   # [local, remote]
    run:
      command: ["npm", "--prefix", "apps/shop/inventory-service", "run", "dev"]

  order-service:
    target: { path: deployment/order-service, namespace: shop }
    http_filter:
      header_filter: 'baggage:\s*[^\n]*\bmirrord-session={{ key }}\b'
    env:
      override:
        PORT: "8082"                     # local port; container listens on 80
    config_patch:
      feature:
        network:
          incoming:
            port_mapping: [[8082, 80]]   # [local, remote]
    run:
      command: ["npm", "--prefix", "apps/shop/order-service", "run", "dev"]

  chat-service:
    target: { path: deployment/chat-service, namespace: shop }
    http_filter:
      header_filter: 'baggage:\s*[^\n]*\bmirrord-session={{ key }}\b'
    env:
      override:
        PORT: "8083"                     # local port; container listens on 80
    config_patch:
      feature:
        network:
          incoming:
            port_mapping: [[8083, 80]]   # [local, remote]
        split_queues:                    # only support-chat messages with this key reach the local consumer
          "*":
            queue_type: Kafka
            message_filter:
              baggage: '.*mirrord-session={{ key }}.*'
    run:
      command: ["npm", "--prefix", "apps/shop/chat-service", "run", "dev"]

  metal-mart-frontend:
    target: { path: deployment/metal-mart-frontend, namespace: shop }
    http_filter:
      header_filter: 'baggage:\s*[^\n]*\bmirrord-session={{ key }}\b'
    env:
      override:
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: dxas4fpir   # NEXT_PUBLIC_* is build-time; remote value is not picked up by next dev
    run:
      command: ["npm", "--prefix", "apps/shop/metal-mart-frontend", "run", "dev", "--", "-p", "3000"]
