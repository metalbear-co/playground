# SOL-201 MetalMart V2 — verification config for `mirrord up`.
# Run from the playground repo root:
#   mirrord up -f mirrord-up-SOL-201.yaml --key <session-key>
#
# Every service runs in split mode: only requests whose `baggage` header carries
# `mirrord-session=<key>` are stolen from the deployed pod into the local process.
# The shop cluster is shared, so no replace mode and no unfiltered steal.
services:
  order-service:
    target: { path: deployment/order-service, namespace: shop }
    http_filter:
      header_filter: 'baggage:\s*[^\n]*\bmirrord-session={{ key }}\b'
    run:
      command: ["npm", "--prefix", "apps/shop/order-service", "run", "dev"]   # local port 80 (container port)

  chat-service:
    target: { path: deployment/chat-service, namespace: shop }
    http_filter:
      header_filter: 'baggage:\s*[^\n]*\bmirrord-session={{ key }}\b'
    env:
      override:
        PORT: "8083"                     # order-service already binds local port 80
    config_patch:
      feature:
        network:
          incoming:
            port_mapping: [[8083, 80]]   # [local, remote]: steal target port 80 into local 8083
        split_queues:                    # only support-chat messages carrying this key reach the local consumer
          "*":
            queue_type: Kafka
            message_filter:
              baggage: '.*mirrord-session={{ key }}.*'
    run:
      command: ["npm", "--prefix", "apps/shop/chat-service", "run", "dev"]

  inventory-service:
    target: { path: deployment/inventory-service, namespace: shop }
    http_filter:
      header_filter: 'baggage:\s*[^\n]*\bmirrord-session={{ key }}\b'
    env:
      override:
        PORT: "8084"                     # distinct local port; order-service has 80, chat-service 8083
    config_patch:
      feature:
        network:
          incoming:
            port_mapping: [[8084, 80]]   # [local, remote]: steal target port 80 into local 8084
    run:
      command: ["npm", "--prefix", "apps/shop/inventory-service", "run", "dev"]

  metal-mart-frontend:
    target: { path: deployment/metal-mart-frontend, namespace: shop }
    http_filter:
      header_filter: 'baggage:\s*[^\n]*\bmirrord-session={{ key }}\b'
    env:
      override:
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: dxas4fpir   # NEXT_PUBLIC_* is build-time; the remote value is not picked up by next dev
    run:
      command: ["npm", "--prefix", "apps/shop/metal-mart-frontend", "run", "dev", "--", "-p", "3000"]   # local port 3000 (container port)
