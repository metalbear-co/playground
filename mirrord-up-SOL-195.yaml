# SOL-195 — MetalMart V2: run the four changed services locally against the
# playground cluster. Run from the repo root:
#   mirrord up -f mirrord-up-SOL-195.yaml --key <session-key>
# Split mode: only requests whose `baggage` header carries
# `mirrord-session=<key>` are stolen; everything else keeps hitting the
# deployed pods. Local ports: order 80, chat 8083, inventory 8084, frontend 3000.
services:
  order-service:
    target: { path: deployment/order-service, namespace: shop }
    http_filter:
      header_filter: 'baggage:\s*[^\n]*\bmirrord-session={{ key }}\b'
    run:
      command: ["npm", "--prefix", "apps/shop/order-service", "run", "dev"]

  chat-service:
    target: { path: deployment/chat-service, namespace: shop }
    http_filter:
      header_filter: 'baggage:\s*[^\n]*\bmirrord-session={{ key }}\b'
    env:
      override:
        PORT: "8083"                     # order-service already binds local port 80
    config_patch:
      feature:
        network:
          incoming:
            port_mapping: [[8083, 80]]   # [local, remote]: steal target port 80 into local 8083
        split_queues:                    # only support-chat messages with this key reach the local consumer
          "*":
            queue_type: Kafka
            message_filter:
              baggage: '.*mirrord-session={{ key }}.*'
    run:
      command: ["npm", "--prefix", "apps/shop/chat-service", "run", "dev"]

  inventory-service:
    target: { path: deployment/inventory-service, namespace: shop }
    http_filter:
      header_filter: 'baggage:\s*[^\n]*\bmirrord-session={{ key }}\b'
    env:
      override:
        PORT: "8084"                     # local 80 (order) and 8083 (chat) are taken
    config_patch:
      feature:
        network:
          incoming:
            port_mapping: [[8084, 80]]   # [local, remote]
    run:
      command: ["npm", "--prefix", "apps/shop/inventory-service", "run", "dev"]

  metal-mart-frontend:
    target: { path: deployment/metal-mart-frontend, namespace: shop }
    http_filter:
      header_filter: 'baggage:\s*[^\n]*\bmirrord-session={{ key }}\b'
    env:
      override:
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: dxas4fpir   # NEXT_PUBLIC_* is build-time; remote value is not picked up by next dev
    run:
      command: ["npm", "--prefix", "apps/shop/metal-mart-frontend", "run", "dev", "--", "-p", "3000"]
