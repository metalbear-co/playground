apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
spec:
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: main
          image: ghcr.io/kafbat/kafka-ui:v1.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: "playground"
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "kafka:9092"
            # Serve under /kafka so the gateway can route
            # playground.metalbear.dev/kafka without rewriting paths.
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: "/kafka"
          ports:
            - containerPort: 8080
              protocol: TCP
          # Spring Boot startup takes 1-3 minutes under the CPU limit; the
          # startup probe holds off liveness until the app is actually up.
          startupProbe:
            httpGet:
              path: /kafka/actuator/health
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /kafka/actuator/health
              port: 8080
          livenessProbe:
            httpGet:
              path: /kafka/actuator/health
              port: 8080
          resources:
            limits:
              cpu: "1"
              memory: 768Mi
            requests:
              cpu: 200m
              memory: 384Mi
