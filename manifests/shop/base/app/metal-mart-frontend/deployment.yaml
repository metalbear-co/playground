apiVersion: apps/v1
kind: Deployment
metadata:
  name: metal-mart-frontend
spec:
  selector:
    matchLabels:
      app: metal-mart-frontend
  template:
    metadata:
      labels:
        app: metal-mart-frontend
    spec:
      containers:
        - name: main
          image: ghcr.io/metalbear-co/playground-metal-mart-frontend:f69f5fe90901f312946b5983c8b36e5a8baeb457
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "3000"
            - name: NEXT_BASE_PATH
              value: "/shop"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service:80"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:80"
            - name: DELIVERY_SERVICE_URL
              value: "http://delivery-service:80"
            - name: FULFILLMENT_SERVICE_URL
              value: "http://fulfillment-worker:80"
            - name: CHAT_SERVICE_URL
              value: "http://chat-service:80"
            - name: KAFKA_ADDRESS
              value: "kafka.infra.svc.cluster.local:9092"
            - name: KAFKA_TOPIC
              value: "support-chat"
            # Optional shared routine for the Cloud Agents dashboard, used when a
            # presenter has not entered their own routine in the page's Agent
            # settings.
            - name: CLOUD_AGENT_TRIGGER_ID
              valueFrom:
                secretKeyRef:
                  name: cloud-agents
                  key: CLOUD_AGENT_TRIGGER_ID
                  optional: true
            - name: CLOUD_AGENT_ROUTINE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloud-agents
                  key: CLOUD_AGENT_ROUTINE_TOKEN
                  optional: true
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloud-agents
                  key: CLAUDE_CODE_OAUTH_TOKEN
                  optional: true
            - name: CLOUD_AGENTS_CALLBACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloud-agents
                  key: CLOUD_AGENTS_CALLBACK_TOKEN
                  optional: true
            # Optional: lets the Cloud Agents dashboard copy a template Linear
            # issue into a new demo ticket ("New demo ticket" button).
            - name: LINEAR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cloud-agents
                  key: LINEAR_API_KEY
                  optional: true
            - name: CLOUD_AGENTS_TEMPLATE_ISSUE
              valueFrom:
                secretKeyRef:
                  name: cloud-agents
                  key: CLOUD_AGENTS_TEMPLATE_ISSUE
                  optional: true
          ports:
            - containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /shop
              port: 3000
              scheme: HTTP
          livenessProbe:
            httpGet:
              path: /shop
              port: 3000
              scheme: HTTP
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
