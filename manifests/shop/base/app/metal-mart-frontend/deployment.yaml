apiVersion: apps/v1
kind: Deployment
metadata:
  name: metal-mart-frontend
spec:
  selector:
    matchLabels:
      app: metal-mart-frontend
  template:
    metadata:
      labels:
        app: metal-mart-frontend
    spec:
      containers:
        - name: main
          image: ghcr.io/metalbear-co/playground-metal-mart-frontend:daec723f837107e461d9c3470d7a10b6309a30e2
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "3000"
            - name: NEXT_BASE_PATH
              value: "/shop"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service:80"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:80"
            - name: DELIVERY_SERVICE_URL
              value: "http://delivery-service:80"
            - name: FULFILLMENT_SERVICE_URL
              value: "http://fulfillment-worker:80"
            - name: CHAT_SERVICE_URL
              value: "http://chat-service:80"
            - name: KAFKA_ADDRESS
              value: "kafka.infra.svc.cluster.local:9092"
            - name: KAFKA_TOPIC
              value: "support-chat"
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloud-agents
                  key: CLAUDE_CODE_OAUTH_TOKEN
                  optional: true
            - name: CLOUD_AGENTS_CALLBACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloud-agents
                  key: CLOUD_AGENTS_CALLBACK_TOKEN
                  optional: true
          ports:
            - containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /shop
              port: 3000
              scheme: HTTP
          livenessProbe:
            httpGet:
              path: /shop
              port: 3000
              scheme: HTTP
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
