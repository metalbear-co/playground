# Kafka queue splitting for chat-service (mirrord operator >= 3.170.0).
# Queue id must match feature.split_queues in apps/shop/chat-service/mirrord.json ("support-chat").
# Reuses the shop-kafka-connection MirrordPropertyList defined for delivery-service.
apiVersion: queues.mirrord.metalbear.co/v1
kind: MirrordSplitConfig
metadata:
  name: chat-service-split
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chat-service
  restart:
    timeout: 180
  queues:
    - id: support-chat
      kind: kafka
      clientConfig: shop-kafka-connection
      appConfig:
        topic:
          - env: KAFKA_TOPIC
            containers:
              - main
        groupId:
          - env: KAFKA_CONSUMER_GROUP
            containers:
              - main
