apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
spec:
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      containers:
        - name: main
          image: ghcr.io/metalbear-co/playground-chat-service:latest
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "80"
            - name: KAFKA_ADDRESS
              value: "kafka.infra.svc.cluster.local:9092"
            - name: KAFKA_TOPIC
              value: "support-chat"
            - name: KAFKA_CONSUMER_GROUP
              value: "chat-service"
            # The shopping agent runs inside chat-service and calls these. They
            # are also what a mirrord session hands to an eval run: with them set
            # the agent reaches the real services, without them it falls back to
            # its frozen catalogue fixture.
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service:80"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:80"
            # Off keeps the canned support-chat greeting. On makes the shopping
            # agent answer every customer turn.
            - name: SHOPPING_AGENT_ENABLED
              value: "false"
          ports:
            - containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 80
              scheme: HTTP
          readinessProbe:
            httpGet:
              path: /health
              port: 80
              scheme: HTTP
          resources:
            limits:
              cpu: 200m
              memory: 200Mi
            requests:
              cpu: 100m
              memory: 100Mi
