apiVersion: v1
kind: ServiceAccount
metadata:
  name: elasticsearch
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      serviceAccountName: elasticsearch
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.18.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            # Skips the vm.max_map_count bootstrap check, which GKE nodes do not set.
            - name: node.store.allow_mmap
              value: "false"
          # The pod has no volume, so this catalog disappears with the container.
          lifecycle:
            postStart:
              exec:
                command:
                  - bash
                  - -c
                  - |
                    for _ in $(seq 1 90); do
                      curl -sf http://127.0.0.1:9200/ >/dev/null && break
                      sleep 2
                    done
                    curl -sf -X PUT http://127.0.0.1:9200/catalog \
                      -H 'Content-Type: application/json' \
                      -d '{"mappings":{"properties":{"title":{"type":"text"},"sku":{"type":"keyword"}}}}'
                    curl -sf -X PUT http://127.0.0.1:9200/catalog/_doc/1 \
                      -H 'Content-Type: application/json' \
                      -d '{"title":"copper kettle","sku":"KETTLE-1"}'
                    curl -sf -X PUT http://127.0.0.1:9200/catalog/_doc/2 \
                      -H 'Content-Type: application/json' \
                      -d '{"title":"linen apron","sku":"APRON-2"}'
                    curl -sf -X PUT http://127.0.0.1:9200/catalog/_doc/3 \
                      -H 'Content-Type: application/json' \
                      -d '{"title":"oak board","sku":"BOARD-3"}'
                    curl -sf -X POST http://127.0.0.1:9200/catalog/_refresh
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
spec:
  selector:
    app: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: http
