# Shop preview workflow with an inline mirrord-ci gate.
#
# This workflow runs directly on pull_request instead of pull_request_target so
# it can safely check out and execute branch code for same-repo PRs. Two labels
# control it (matched case-insensitively) on same-repo PRs:
# - `Preview`  -> start a preview environment only, no mirrord CI E2E gate
# - `CI+Prev`  -> run the mirrord CI E2E gate first, then start the preview
name: Preview Environment - Shop (Gated Inline)
run-name: >-
  Preview Shop Gated -
  ${{
    github.event.action == 'closed' &&
    format('stop PR #{0}', github.event.pull_request.number) ||
    format('{0} PR #{1}', github.event.action, github.event.pull_request.number)
  }}

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, closed]

permissions:
  contents: read

concurrency:
  group: preview-shop-gated-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  resolve-context:
    name: Resolve trigger context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      run_gate: ${{ steps.resolve.outputs.run_gate }}
      mode: ${{ steps.resolve.outputs.mode }}
      branch: ${{ steps.resolve.outputs.branch }}
      base_ref: ${{ steps.resolve.outputs.base_ref }}
      preview_key: ${{ steps.resolve.outputs.preview_key }}
      image_tag_key: ${{ steps.resolve.outputs.image_tag_key }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      pr_url: ${{ steps.resolve.outputs.pr_url }}
      should_comment: ${{ steps.resolve.outputs.should_comment }}
      services_reason: ${{ steps.resolve.outputs.services_reason }}
    steps:
      - name: Resolve PR event into shared outputs
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const action = context.payload.action;
            const sameRepoName = `${owner}/${repo}`;

            const trimmed = value => (value || '').trim();
            const sanitizeTag = value => {
              const sanitized = (value || '')
                .toLowerCase()
                .replace(/[^a-z0-9._-]+/g, '-')
                .replace(/^-+|-+$/g, '')
                .slice(0, 60);
              return sanitized || 'preview';
            };
            const previewKeyFromBranch = value => {
              const branch = trimmed(value);
              const segments = branch.split('/').filter(Boolean);
              return segments[segments.length - 1] || branch;
            };

            const branch = pr.head.ref;
            const isSameRepo = pr.head.repo.full_name === sameRepoName;

            // Labels are matched case-insensitively:
            // - "preview" -> preview environment only, no E2E gate
            // - "ci+prev" -> mirrord CI E2E gate, then preview
            const PREVIEW_ONLY_LABEL = 'preview';
            const CI_AND_PREVIEW_LABEL = 'ci+prev';
            const relevantLabels = [PREVIEW_ONLY_LABEL, CI_AND_PREVIEW_LABEL];

            const labels = (pr.labels || []).map(label => label.name.toLowerCase());
            const hasPreviewLabel = labels.some(name => relevantLabels.includes(name));
            const hasCiPrevLabel = labels.includes(CI_AND_PREVIEW_LABEL);
            const changedLabel = (context.payload.label?.name || '').toLowerCase();
            const isPreviewLabelEvent = relevantLabels.includes(changedLabel);
            const previewKey = previewKeyFromBranch(branch);

            const out = {
              should_run: 'false',
              run_gate: hasCiPrevLabel ? 'true' : 'false',
              mode: (action === 'closed' || (action === 'unlabeled' && isPreviewLabelEvent && !hasPreviewLabel)) ? 'stop' : 'start',
              branch,
              base_ref: pr.base.ref,
              preview_key: previewKey,
              image_tag_key: sanitizeTag(branch || previewKey),
              pr_number: String(pr.number),
              pr_url: pr.html_url,
              should_comment: 'false',
              services_reason: '',
            };

            if (!isSameRepo) {
              out.services_reason = 'fork-pr-not-supported';
            } else if (action === 'closed') {
              out.should_run = 'true';
              out.services_reason = 'pull_request:closed';
            } else if (action === 'unlabeled' && isPreviewLabelEvent) {
              if (hasPreviewLabel) {
                // Another relevant label is still on the PR; the running
                // preview stays up, nothing to do for this event.
                out.services_reason = 'pull_request:label-removed-other-label-remains';
              } else {
                out.should_run = 'true';
                out.services_reason = 'pull_request:preview-label-removed';
              }
            } else if (action === 'labeled' && isPreviewLabelEvent) {
              out.should_run = 'true';
              out.should_comment = 'true';
              out.services_reason = `pull_request:${changedLabel}-label-added`;
            } else if (hasPreviewLabel) {
              out.should_run = 'true';
              out.should_comment = 'true';
              out.services_reason = `pull_request:${action}-with-preview-label`;
            } else {
              out.services_reason = `pull_request:${action}-without-preview-label`;
            }

            for (const [key, value] of Object.entries(out)) {
              core.setOutput(key, value);
            }

  detect-changes:
    name: Detect changed services
    needs: resolve-context
    if: needs.resolve-context.outputs.should_run == 'true' && needs.resolve-context.outputs.mode == 'start'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      has_changes: ${{ steps.build-matrix.outputs.has_changes }}
      services_list: ${{ steps.build-matrix.outputs.services_list }}
      head_sha: ${{ steps.build-matrix.outputs.head_sha }}
      storefront_added: ${{ steps.build-matrix.outputs.storefront_added }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-context.outputs.branch }}

      - name: Detect changed services via git diff
        id: build-matrix
        env:
          BASE_REF: ${{ needs.resolve-context.outputs.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF"
          CHANGED_FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          CHANGES='[]'
          for path in $(jq -r '.services[].path' .github/preview-services.json); do
            name=$(jq -r --arg p "$path" '.services[] | select(.path == $p) | .name' .github/preview-services.json)
            if echo "$CHANGED_FILES" | grep -q "^${path}/"; then
              CHANGES=$(echo "$CHANGES" | jq -c --arg n "$name" '. + [$n]')
            fi
          done
          SERVICES_LIST=$(jq -r --argjson changes "$CHANGES" \
            '[.services[] | select(.name as $n | $changes | index($n)) | .name] | join(", ")' \
            .github/preview-services.json)
          COUNT=$(echo "$CHANGES" | jq 'length')
          # A backend-only change still gets a storefront preview under the same
          # key: share-ingress injects the session header on the storefront's
          # share host and the storefront propagates it to every backend call,
          # so that share link is the one place a backend change can be seen
          # without the browser extension. The storefront itself is unchanged,
          # so the preview reuses the image the deployment is running instead
          # of rebuilding it.
          STOREFRONT_ADDED=false
          PREVIEW_SET="$CHANGES"
          if [ "$COUNT" -gt 0 ] && ! echo "$CHANGES" | jq -e 'index("metal-mart-frontend")' >/dev/null; then
            PREVIEW_SET=$(echo "$CHANGES" | jq -c '. + ["metal-mart-frontend"]')
            STOREFRONT_ADDED=true
          fi
          MATRIX=$(jq -c --argjson set "$PREVIEW_SET" --argjson added "$STOREFRONT_ADDED" \
            '{include: [.services[] | select(.name as $n | $set | index($n))
              | if $added and .name == "metal-mart-frontend" then . + {reuse_deployed_image: "true"} else . end]}' \
            .github/preview-services.json)
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "storefront_added=$STOREFRONT_ADDED" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "services_list=$SERVICES_LIST" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Changed services ($COUNT): $SERVICES_LIST"

  e2e-gate:
    name: E2E Gate (${{ matrix.name }})
    needs: [resolve-context, detect-changes]
    if: needs.detect-changes.outputs.has_changes == 'true' && needs.resolve-context.outputs.run_gate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    permissions:
      contents: read
      id-token: write
    env:
      SERVICE_KEY: ci-${{ github.run_id }}-${{ matrix.name }}
    steps:
      - name: Decide whether this service has a gate
        id: gate-config
        env:
          MATRIX_NAME: ${{ matrix.name }}
          E2E_COMMAND: ${{ matrix.e2e_command }}
          E2E_SCRIPT: ${{ matrix.e2e_script }}
        run: |
          if [ -z "$E2E_COMMAND" ] || [ -z "$E2E_SCRIPT" ]; then
            echo "No E2E configured for $MATRIX_NAME, skipping gate."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR branch
        if: steps.gate-config.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-context.outputs.branch }}

      - name: Setup Node.js
        if: steps.gate-config.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build service
        if: steps.gate-config.outputs.skip != 'true'
        working-directory: ${{ matrix.path }}
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
            npm run build
          elif [ -f package.json ]; then
            npm install
            npm run build
          else
            echo "No package.json in $PWD, assuming build is not required."
          fi

      - name: Authenticate to GCP via Workload Identity Federation
        if: steps.gate-config.outputs.skip != 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        if: steps.gate-config.outputs.skip != 'true'
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: playground-cluster-1
          location: us-central1-c
          project_id: playground-383912

      - name: Install mirrord
        if: steps.gate-config.outputs.skip != 'true'
        run: |
          curl -fsSL https://raw.githubusercontent.com/metalbear-co/mirrord/main/scripts/install.sh | bash
          mirrord --version

      - name: Generate mirrord ci config
        if: steps.gate-config.outputs.skip != 'true'
        env:
          NAMESPACE: ${{ matrix.namespace }}
          DEPLOYMENT: ${{ matrix.deployment }}
        run: |
          mkdir -p .mirrord-tmp
          cat > .mirrord-tmp/ci.json <<EOF
          {
            "target": {
              "namespace": "${NAMESPACE}",
              "path": { "deployment": "${DEPLOYMENT}" }
            },
            "ci": { "output_dir": "/tmp/mirrord" },
            "feature": {
              "network": {
                "incoming": {
                  "mode": "steal",
                  "http_filter": {
                    "header_filter": "baggage:\\\\s*[^\\\\n]*\\\\bmirrord=${SERVICE_KEY}\\\\b"
                  }
                },
                "outgoing": true
              },
              "fs": { "mode": "read" }
            }
          }
          EOF

      - name: Verify mirrord ci config
        if: steps.gate-config.outputs.skip != 'true'
        run: mirrord verify-config .mirrord-tmp/ci.json

      - name: Start mirrord ci session
        if: steps.gate-config.outputs.skip != 'true'
        env:
          MIRRORD_CI_API_KEY: ${{ secrets.MIRRORD_CI_API_KEY }}
          E2E_COMMAND: ${{ matrix.e2e_command }}
        run: |
          mirrord ci start --config-file .mirrord-tmp/ci.json -- $E2E_COMMAND

      - name: Wait for local service to be ready
        if: steps.gate-config.outputs.skip != 'true'
        env:
          READY_MARKER: ${{ matrix.ready_marker }}
        run: |
          set -euo pipefail
          MARKER="${READY_MARKER:-Listening on port}"
          DEADLINE=$(( $(date +%s) + 120 ))
          echo "Waiting up to 120s for local service log to contain: $MARKER"
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            if grep -RFq "$MARKER" /tmp/mirrord 2>/dev/null; then
              echo "Local service is ready."
              grep -RF "$MARKER" /tmp/mirrord || true
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for local service to log: $MARKER"
          echo "--- mirrord stdout dump ---"
          for f in $(find /tmp/mirrord -name stdout); do echo "=== $f ==="; cat "$f"; done || true
          echo "--- mirrord stderr dump ---"
          for f in $(find /tmp/mirrord -name stderr); do echo "=== $f ==="; cat "$f"; done || true
          exit 1

      - name: Run E2E tests
        id: gate-run
        if: steps.gate-config.outputs.skip != 'true'
        env:
          # Go through the frontend proxy (/shop/api) rather than the gateway's
          # direct order-service routes (/orders, /banner). The direct routes hit
          # the order-service NEG, where the GKE load balancer health-checks pods
          # itself and also sends traffic to mirrord preview pods that Kubernetes
          # marks not-ready — so a request can bypass the stolen target pod and
          # land on a stale preview. The frontend reaches order-service through
          # the cluster Service (kube-proxy), which only routes to ready pods,
          # guaranteeing the request arrives at the target pod where the mirrord
          # ci session's header filter applies. Baggage propagates through the
          # frontend via OTel instrumentation.
          SHOP_URL: https://playground.metalbear.dev/shop/api
          BAGGAGE_HEADER: mirrord=${{ env.SERVICE_KEY }}
          E2E_SCRIPT: ${{ matrix.e2e_script }}
        run: |
          chmod +x "$E2E_SCRIPT"
          "$E2E_SCRIPT"

      - name: Stop mirrord ci session
        if: always() && steps.gate-config.outputs.skip != 'true'
        run: mirrord ci stop || true

      - name: Write gate result artifact
        if: always()
        env:
          E2E_COMMAND: ${{ matrix.e2e_command }}
          E2E_SCRIPT: ${{ matrix.e2e_script }}
        run: |
          mkdir -p /tmp/gate-results
          if [ -z "$E2E_COMMAND" ] || [ -z "$E2E_SCRIPT" ]; then
            status="skipped"
          elif [ "${{ steps.gate-run.outcome }}" = "success" ]; then
            status="passed"
          else
            status="failed"
          fi
          printf '{"name":"%s","gate_status":"%s"}\n' "${{ matrix.name }}" "$status" > /tmp/gate-results/${{ matrix.name }}.json

      - name: Upload gate result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-result-${{ matrix.name }}
          path: /tmp/gate-results/${{ matrix.name }}.json
          retention-days: 1

      - name: Upload mirrord logs
        if: always() && steps.gate-config.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-gate-${{ matrix.name }}-mirrord-logs
          path: /tmp/mirrord
          if-no-files-found: ignore

  build-and-preview:
    name: Build & Preview (${{ matrix.name }})
    needs: [resolve-context, detect-changes, e2e-gate]
    # The E2E gate must pass when the CI+Prev label requested it; with the
    # Preview-only label the gate is skipped and the preview starts directly.
    if: >-
      !cancelled() &&
      needs.detect-changes.outputs.has_changes == 'true' &&
      (needs.e2e-gate.result == 'success' ||
       (needs.resolve-context.outputs.run_gate != 'true' && needs.e2e-gate.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-context.outputs.branch }}

      # The docker steps are skipped for a service whose matrix entry reuses
      # the deployed image (the storefront added to a backend-only preview).
      - name: Set up QEMU
        if: matrix.reuse_deployed_image != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: matrix.reuse_deployed_image != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: matrix.reuse_deployed_image != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build-image
        if: matrix.reuse_deployed_image != 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.path }}
          file: ${{ matrix.path }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/metalbear-co/playground-${{ matrix.name }}:preview-${{ needs.resolve-context.outputs.image_tag_key }}-${{ needs.detect-changes.outputs.head_sha }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: playground-cluster-1
          location: us-central1-c
          project_id: playground-383912

      # The preview image is either the one built above from the PR branch, or
      # for a service that is unchanged in this PR, the image its deployment
      # currently runs (the `main` container, falling back to the first one).
      - name: Resolve preview image
        id: image
        env:
          REUSE_DEPLOYED_IMAGE: ${{ matrix.reuse_deployed_image }}
          BUILT_IMAGE: ghcr.io/metalbear-co/playground-${{ matrix.name }}:preview-${{ needs.resolve-context.outputs.image_tag_key }}-${{ needs.detect-changes.outputs.head_sha }}
          NAMESPACE: ${{ matrix.namespace }}
          DEPLOYMENT: ${{ matrix.deployment }}
        run: |
          set -euo pipefail
          if [ "$REUSE_DEPLOYED_IMAGE" = "true" ]; then
            image=$(kubectl get deployment -n "$NAMESPACE" "$DEPLOYMENT" -o json \
              | jq -r '.spec.template.spec.containers | (map(select(.name == "main")) + .) | first | .image')
            echo "Reusing deployed image for $DEPLOYMENT: $image"
          else
            image="$BUILT_IMAGE"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Start mirrord preview
        id: start-preview
        uses: metalbear-co/mirrord-preview@master
        with:
          action: start
          target: deployment/${{ matrix.deployment }}
          namespace: ${{ matrix.namespace }}
          image: ${{ steps.image.outputs.image }}
          mode: steal
          filter: 'baggage:\s*[^\n]*\bmirrord-session={{ key }}\b'
          ttl_mins: '120'
          key: ${{ needs.resolve-context.outputs.preview_key }}
          extra_config: ${{ matrix.extra_config }}

      # Share link (no extension needed): from the action's `preview-url`
      # output, else the PreviewSession's `status.shareHost`. Best-effort.
      - name: Resolve preview share URL
        id: share-url
        if: steps.start-preview.outcome == 'success'
        continue-on-error: true
        env:
          ACTION_PREVIEW_URL: ${{ steps.start-preview.outputs.preview-url }}
          NAMESPACE: ${{ matrix.namespace }}
          PREVIEW_KEY: ${{ needs.resolve-context.outputs.preview_key }}
          IMAGE: ${{ steps.image.outputs.image }}
          SHARE_PATH: ${{ matrix.share_path }}
        run: |
          set -euo pipefail
          share_url=""
          if [ -n "$ACTION_PREVIEW_URL" ]; then
            share_url="${ACTION_PREVIEW_URL%/}${SHARE_PATH}"
            echo "Share URL from mirrord-preview action output."
          else
            echo "Action did not expose preview-url; reading status.shareHost from the PreviewSession."
            share_host=""
            for attempt in $(seq 1 10); do
              share_host=$(kubectl get previewsessions.preview.mirrord.metalbear.co -n "$NAMESPACE" -o json \
                | jq -r --arg key "$PREVIEW_KEY" --arg image "$IMAGE" \
                    '[.items[] | select(.spec.key == $key and .spec.image == $image) | .status.shareHost // empty] | first // empty')
              [ -n "$share_host" ] && break
              echo "shareHost not set yet (attempt $attempt), retrying..."
              sleep 3
            done
            [ -n "$share_host" ] && share_url="https://${share_host}${SHARE_PATH}"
          fi
          if [ -z "$share_url" ]; then
            echo "::warning::No share URL for key=$PREVIEW_KEY image=$IMAGE; share link will be omitted."
            echo "share_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "share_url=$share_url" >> "$GITHUB_OUTPUT"
          echo "::notice::Preview share URL: $share_url"

      - name: Write preview result artifact
        if: always()
        env:
          SHARE_URL: ${{ steps.share-url.outputs.share_url }}
        run: |
          mkdir -p /tmp/preview-results
          if [ "${{ steps.start-preview.outcome }}" = "success" ]; then
            status="started"
          elif [ "${{ steps.build-image.outcome }}" = "failure" ]; then
            status="build-failed"
          else
            status="failed"
          fi
          jq -n -c --arg name "${{ matrix.name }}" --arg status "$status" --arg share_url "${SHARE_URL:-}" \
            '{name: $name, preview_status: $status, share_url: $share_url}' \
            > /tmp/preview-results/${{ matrix.name }}.json

      - name: Upload preview result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-result-${{ matrix.name }}
          path: /tmp/preview-results/${{ matrix.name }}.json
          retention-days: 1

  notify:
    name: Post PR status
    needs: [resolve-context, detect-changes, e2e-gate, build-and-preview]
    if: always() && needs.resolve-context.outputs.mode == 'start' && needs.resolve-context.outputs.should_comment == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Download gate result artifacts
        if: needs.detect-changes.outputs.has_changes == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: gate-result-*
          path: /tmp/gate-results
          merge-multiple: true

      - name: Download preview result artifacts
        if: needs.detect-changes.outputs.has_changes == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: preview-result-*
          path: /tmp/preview-results
          merge-multiple: true

      - name: Post sticky PR comment
        uses: actions/github-script@v7
        env:
          PREVIEW_KEY: ${{ needs.resolve-context.outputs.preview_key }}
          PR_NUMBER: ${{ needs.resolve-context.outputs.pr_number }}
          SERVICES_LIST: ${{ needs.detect-changes.outputs.services_list }}
          HAS_CHANGES: ${{ needs.detect-changes.outputs.has_changes }}
          STOREFRONT_ADDED: ${{ needs.detect-changes.outputs.storefront_added }}
          GATE_RESULT: ${{ needs.e2e-gate.result }}
          PREVIEW_RESULT: ${{ needs.build-and-preview.result }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const issueNumber = Number(process.env.PR_NUMBER);
            const key = process.env.PREVIEW_KEY;
            const hasChanges = process.env.HAS_CHANGES === 'true';
            const storefrontAdded = process.env.STOREFRONT_ADDED === 'true';
            const gateResult = process.env.GATE_RESULT || 'skipped';
            const previewResult = process.env.PREVIEW_RESULT || 'skipped';
            const url = 'https://playground.metalbear.dev/shop';
            const marker = '<!-- preview-shop-pr-gated -->';
            const header = `baggage: mirrord-session=${key}`;
            const shareDocsUrl = 'https://metalbear.com/mirrord/docs/use-cases/preview-environments#sharing-a-preview-via-a-link';
            const extensionDocsUrl = 'https://metalbear.com/mirrord/docs/using-mirrord/incoming-traffic/filter-incoming-traffic/debug-from-browser';
            // metalbear.com/mirrord/extension applies a base64 JSON config payload
            // from the URL fragment through the mirrord browser extension's
            // content script (joins the live session when `mirrord ui` is
            // running, otherwise installs a transient header rule scoped to the
            // playground host). Without the extension, the page is the install
            // page. Payload fields: `header_filter` (a literal "name: value"
            // header) and `inject_scope` (a declarativeNetRequest urlFilter).
            const extensionScope = '*://playground.metalbear.dev/*';
            const extensionPayload = Buffer.from(JSON.stringify({
              header_filter: header,
              inject_scope: extensionScope,
            })).toString('base64');
            const extensionConfigUrl = `https://metalbear.com/mirrord/extension/#config=${extensionPayload}`;

            const readJsonDir = dir => {
              if (!fs.existsSync(dir)) return [];
              return fs.readdirSync(dir)
                .filter(file => file.endsWith('.json'))
                .map(file => JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8')));
            };

            const gateResults = readJsonDir('/tmp/gate-results');
            const previewResults = readJsonDir('/tmp/preview-results');
            const gateByName = new Map(gateResults.map(item => [item.name, item.gate_status]));
            const previewByName = new Map(previewResults.map(item => [item.name, item.preview_status]));
            const shareUrlByName = new Map(previewResults
              .filter(item => item.share_url)
              .map(item => [item.name, item.share_url]));
            // With the Preview-only label there are no gate artifacts, so the
            // service list is the union of gate and preview results.
            const serviceNames = [...new Set([...gateByName.keys(), ...previewByName.keys()])];
            const services = serviceNames.map(name => ({
              name,
              gate: gateByName.get(name) || 'skipped',
              preview: previewByName.get(name) || 'not-started',
            }));

            const gateBadge = {
              success: ':white_check_mark: passed',
              failure: ':x: failed',
              cancelled: ':grey_exclamation: cancelled',
              skipped: ':white_circle: skipped',
            }[gateResult] || `:question: ${gateResult}`;

            const previewBadge = {
              success: ':rocket: started',
              failure: ':x: failed',
              cancelled: ':grey_exclamation: cancelled',
              skipped: ':white_circle: not started',
            }[previewResult] || `:question: ${previewResult}`;

            // The storefront that was added only to carry the direct link is
            // listed after the services that actually changed.
            const isAddedStorefront = service => storefrontAdded && service.name === 'metal-mart-frontend';
            services.sort((a, b) => Number(isAddedStorefront(a)) - Number(isAddedStorefront(b)));
            const serviceLabel = service =>
              isAddedStorefront(service)
                ? `\`${service.name}\` _(unchanged, previewed for the direct link)_`
                : `\`${service.name}\``;
            const tableRows = services.length > 0
              ? services.map(service => `| ${serviceLabel(service)} | ${service.gate} | ${service.preview} |`).join('\n')
              : '| _(no registered service paths changed)_ | | |';

            const statusLine = [
              hasChanges ? `**Changed:** ${process.env.SERVICES_LIST}` : '**Changed:** _no registered service paths_',
              ...(gateResult !== 'skipped' ? [`**E2E gate:** ${gateBadge}`] : []),
              `**Preview:** ${previewBadge}`,
              `**Session:** \`${key}\``,
            ].join(' · ');

            const body = [
              marker,
              '## :bear: mirrord Preview — Metal Mart',
              '',
              statusLine,
              '',
              '| Service | E2E gate | Preview |',
              '|---|---|---|',
              tableRows,
            ];

            if (previewResult === 'success') {
              // Each share host serves one service's preview with the session
              // header injected by share-ingress. The storefront propagates that
              // header to every backend call it makes, so its share host is the
              // one link where a backend change is visible without the browser
              // extension (a backend-only PR gets a storefront preview for
              // exactly that). Backend share hosts are API bases with nothing
              // at `/`, so they are listed under the terminal option.
              const storefrontShareUrl = shareUrlByName.get('metal-mart-frontend');
              const apiBases = services
                .filter(service => service.name !== 'metal-mart-frontend' && shareUrlByName.has(service.name));
              const apiBaseWidth = Math.max(0, ...apiBases.map(service => service.name.length));
              const apiBaseLines = apiBases
                .map(service => `${service.name.padEnd(apiBaseWidth)}  ${shareUrlByName.get(service.name)}`);

              body.push(
                '',
                '### Four ways in — pick yours',
                '',
                '**1. :link: Just click** — no setup, share with anyone',
                ...(storefrontShareUrl
                  ? [
                      `**[Open the storefront for this preview →](${storefrontShareUrl})**`,
                      `Browse, add to cart, place an order — every call is handled by the previewed services. ([how it works](${shareDocsUrl}))`,
                    ]
                  : ['_No storefront share link was minted for this preview (share-ingress unavailable or the session had no share host)._']),
                '',
                '**2. :jigsaw: One-click extension setup** — use the real URL with the mirrord Browser Extension',
                `[Configure the extension for this preview](${extensionConfigUrl}), then open [playground.metalbear.dev/shop](${url}). (The [extension](${extensionDocsUrl}) must be installed; the page offers it if not.)`,
                '',
                '**3. :hammer_and_wrench: Set the header yourself** — any header tool or the extension, configured by hand',
                `Open [playground.metalbear.dev/shop](${url}) with \`${header}\`.`,
                '',
                '**4. :computer: Terminal** — for scripts and API checks',
                '```',
                `curl -H "${header}" ${url}/api/products`,
                '```',
                ...(apiBaseLines.length > 0
                  ? ['Previewed services directly (header injected for you):', '```', ...apiBaseLines, '```']
                  : []),
                '',
                '_Preview stops when the PR is merged or closed._',
              );
            } else if (gateResult === 'failure' || gateResult === 'cancelled') {
              body.push(
                '',
                'Preview creation did not run because the E2E gate did not pass.'
              );
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            const existing = comments.find(comment =>
              comment.body && (comment.body.includes(marker) || comment.body.includes('mirrord Preview Environment - Metal Mart'))
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body.join('\n'),
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: body.join('\n'),
              });
            }

  notify-slack:
    name: Post preview link to Slack
    needs: [resolve-context, detect-changes, build-and-preview]
    if: needs.resolve-context.outputs.mode == 'start' && needs.detect-changes.outputs.has_changes == 'true' && needs.build-and-preview.result == 'success' && !cancelled()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Download preview result artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: preview-result-*
          path: /tmp/preview-results
          merge-multiple: true

      # The Slack message mirrors the PR comment's four ways in. It is built
      # with jq into a payload file because the storefront share link, the
      # extension config link and the per-service API bases all come from the
      # preview result artifacts rather than from job outputs.
      - name: Build Slack payload
        env:
          PR_URL: ${{ needs.resolve-context.outputs.pr_url }}
          PR_NUMBER: ${{ needs.resolve-context.outputs.pr_number }}
          SERVICES_LIST: ${{ needs.detect-changes.outputs.services_list }}
          PREVIEW_KEY: ${{ needs.resolve-context.outputs.preview_key }}
        run: |
          set -euo pipefail
          url="https://playground.metalbear.dev/shop"
          header="baggage: mirrord-session=${PREVIEW_KEY}"
          docs="https://metalbear.com/mirrord/docs/use-cases/preview-environments#sharing-a-preview-via-a-link"
          # `-j` keeps the trailing newline out of the base64 payload.
          extension_payload=$(jq -n -c -j --arg h "$header" '{header_filter: $h, inject_scope: "*://playground.metalbear.dev/*"}' | base64 | tr -d '\n')
          extension_url="https://metalbear.com/mirrord/extension/#config=${extension_payload}"

          storefront_url=$(jq -r '.share_url // empty' /tmp/preview-results/metal-mart-frontend.json 2>/dev/null || true)
          if [ -n "$storefront_url" ]; then
            just_click="<${storefront_url}|Open the storefront for this preview> — browse, add to cart, place an order; every call hits the previewed services. (<${docs}|how it works>)"
          else
            just_click="_No storefront share link was minted for this preview._"
          fi

          api_bases=$(jq -r -s '
            [.[] | select(.name != "metal-mart-frontend" and (.share_url // "") != "")]
            | (map(.name | length) | max // 0) as $width
            | map("\(.name)\(" " * ($width - (.name | length) + 2))\(.share_url)")
            | join("\n")' /tmp/preview-results/*.json 2>/dev/null || true)
          terminal="\`\`\`curl -H \"${header}\" ${url}/api/products\`\`\`"
          if [ -n "$api_bases" ]; then
            terminal="${terminal}"$'\n'"Previewed services directly (header injected for you):"$'\n'"\`\`\`${api_bases}\`\`\`"
          fi

          jq -n \
            --arg pr "<${PR_URL}|#${PR_NUMBER}>" \
            --arg services "$SERVICES_LIST" \
            --arg key "$PREVIEW_KEY" \
            --arg just_click "$just_click" \
            --arg extension_url "$extension_url" \
            --arg url "$url" \
            --arg header "$header" \
            --arg terminal "$terminal" \
            '{blocks: [
              {type: "header", text: {type: "plain_text", text: "🐻 mirrord Preview — Metal Mart"}},
              {type: "section", text: {type: "mrkdwn", text: "*PR:* \($pr) · *Changed:* \($services) · *Session:* `\($key)`"}},
              {type: "section", text: {type: "mrkdwn", text: "*Four ways in — pick yours*"}},
              {type: "section", text: {type: "mrkdwn", text: "*1. 🔗 Just click* — no setup, share with anyone\n\($just_click)"}},
              {type: "section", text: {type: "mrkdwn", text: "*2. 🧩 One-click extension setup* — use the real URL with the mirrord Browser Extension\n<\($extension_url)|Configure the extension for this preview>, then open <\($url)|playground.metalbear.dev/shop>."}},
              {type: "section", text: {type: "mrkdwn", text: "*3. 🛠️ Set the header yourself* — any header tool or the extension, configured by hand\nOpen <\($url)|playground.metalbear.dev/shop> with `\($header)`."}},
              {type: "section", text: {type: "mrkdwn", text: "*4. 💻 Terminal* — for scripts and API checks\n\($terminal)"}},
              {type: "context", elements: [{type: "mrkdwn", text: "Preview stops when the PR is merged or closed."}]}
            ]}' > /tmp/slack-payload.json
          cat /tmp/slack-payload.json

      - name: Post preview link to Slack
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload-file-path: /tmp/slack-payload.json
          payload-file-path-parsed: false
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  preview-stop:
    name: Stop all previews
    needs: resolve-context
    if: needs.resolve-context.outputs.should_run == 'true' && needs.resolve-context.outputs.mode == 'stop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: playground-cluster-1
          location: us-central1-c
          project_id: playground-383912

      - name: Install mirrord
        run: curl -fsSL https://raw.githubusercontent.com/metalbear-co/mirrord/main/scripts/install.sh | bash

      # The CLI is invoked directly (not via the mirrord-preview action) because
      # the action's stop path ignores its namespace input, and sessions live in
      # the shop namespace — not the kubeconfig default the CLI would search.
      # Best-effort cleanup: the stop errors when no preview session matches the
      # key (none was ever started for this PR, or the TTL / another stop
      # workflow already reaped it). Those backstops make a missed stop
      # harmless, so don't fail the run over it.
      - name: Stop mirrord preview
        continue-on-error: true
        run: mirrord preview stop --key "$PREVIEW_KEY" --namespace shop
        env:
          PREVIEW_KEY: ${{ needs.resolve-context.outputs.preview_key }}
