name: Release account-srvc
on:
  push:
    branches: [main]
    paths:
      - "apps/ci-lab/account-srvc/**"
      - ".github/workflows/build-account-srvc.yaml"
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          file: apps/ci-lab/account-srvc/Dockerfile
          platforms: linux/amd64
          context: apps/ci-lab/account-srvc
          push: true
          tags: |
            ghcr.io/metalbear-co/playground-account-srvc:latest
            ghcr.io/metalbear-co/playground-account-srvc:${{ github.sha }}
