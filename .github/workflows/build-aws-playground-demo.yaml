name: Release aws-playground demo service
# Requires repo secrets, both of which embed the AWS account and so are kept out
# of this public repository:
#   AWS_S8S_DEPLOY_ROLE_ARN  - the s8s-github-deploy role, assumed via OIDC
#   AWS_S8S_ECR_REPOSITORY   - the demo service's ECR repository URL
# Both are Terraform outputs of environments/s8s-aws in metalbear-co/infra.
on:
  push:
    branches: [main]
    paths:
      - "apps/aws-playground/demo-service/**"
      - ".github/workflows/build-aws-playground-demo.yaml"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: s8s
  ECS_SERVICE: s8s-demo
  ECS_TASK_FAMILY: s8s-demo
  CONTAINER_NAME: demo

# One deployment at a time, so two quick merges cannot race each other into
# UpdateService in the wrong order.
concurrency:
  group: aws-playground-demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_S8S_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/aws-playground/demo-service
          file: ./apps/aws-playground/demo-service/Dockerfile
          # The ECS task definition runs on ARM64 Fargate.
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.AWS_S8S_ECR_REPOSITORY }}:latest
            ${{ secrets.AWS_S8S_ECR_REPOSITORY }}:${{ github.sha }}

      - name: Read the running task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition \
            --output json > task-definition.json

      - name: Point the task definition at the new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ secrets.AWS_S8S_ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
