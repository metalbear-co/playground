name: Release gcp-playground demo service
# Secrets and their provenance: apps/gcp-playground/demo-service/README.md
on:
  push:
    branches: [main]
    paths:
      - "apps/gcp-playground/**"
      - ".github/workflows/build-gcp-playground-demo.yaml"
  workflow_dispatch:

env:
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE: s8s-demo

# One deployment at a time, so two quick merges cannot race each other into the
# same service in the wrong order.
concurrency:
  group: gcp-playground-demo
  cancel-in-progress: false

jobs:
  # The deploy secrets are Terraform outputs of the s8s-gcp root, so they only
  # exist once that environment is applied. Skip rather than fail until then.
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_S8S_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          if [ -n "$WORKLOAD_IDENTITY_PROVIDER" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP deploy secrets are not set; skipping deploy."
          fi

  deploy:
    needs: check-secrets
    if: needs.check-secrets.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        # docker/setup-buildx-action@v4.3.0
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Authenticate to Google Cloud
        # google-github-actions/auth@v2.1.13
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.GCP_S8S_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_S8S_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        # google-github-actions/setup-gcloud@v2.1.5
        uses: google-github-actions/setup-gcloud@6a7c903a70c8625ed6700fa299f5ddb4ca6022e9

      - name: Log in to Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      # Cloud Run runs linux/amd64 only. Both images are rebuilt on every run so
      # the deploy step always has a matching pair, rather than having to work
      # out which of the two a given commit left stale.
      - name: Build and push the demo image
        # docker/build-push-action@v7.3.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ./apps/gcp-playground/demo-service
          file: ./apps/gcp-playground/demo-service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.GCP_S8S_ARTIFACT_REGISTRY }}/s8s-demo/demo-service:latest
            ${{ secrets.GCP_S8S_ARTIFACT_REGISTRY }}/s8s-demo/demo-service:${{ github.sha }}

      - name: Build and push the bootstrap sidecar image
        # docker/build-push-action@v7.3.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ./apps/gcp-playground/mirrord-bootstrap-sidecar
          file: ./apps/gcp-playground/mirrord-bootstrap-sidecar/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BOOTSTRAP_IMAGE=${{ secrets.GCP_S8S_BOOTSTRAP_IMAGE }}
          tags: |
            ${{ secrets.GCP_S8S_ARTIFACT_REGISTRY }}/s8s-bootstrap-sidecar/bootstrap-sidecar:latest
            ${{ secrets.GCP_S8S_ARTIFACT_REGISTRY }}/s8s-bootstrap-sidecar/bootstrap-sidecar:${{ github.sha }}

      # Terraform owns everything about the service except which images its
      # containers run, so the deploy only swaps those two and leaves the
      # probes, volume, dependency order and environment untouched.
      # Swaps the two images and leaves the rest of the spec exactly as it was.
      # `gcloud run services update --container` cannot do this: see the PR.
      - name: Deploy
        run: |
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --region "$GCP_REGION" --format export > service.yaml

          python3 - <<'PATCH'
          import os, yaml

          images = {
              "demo": f"{os.environ['ARTIFACT_REGISTRY']}/s8s-demo/demo-service:{os.environ['GITHUB_SHA']}",
              "mirrord-bootstrap": f"{os.environ['ARTIFACT_REGISTRY']}/s8s-bootstrap-sidecar/bootstrap-sidecar:{os.environ['GITHUB_SHA']}",
          }

          with open("service.yaml") as handle:
              service = yaml.safe_load(handle)

          # Server-populated, and rejected on the way back in.
          for annotation in ("run.googleapis.com/urls", "run.googleapis.com/ingress-status"):
              service["metadata"].get("annotations", {}).pop(annotation, None)

          containers = service["spec"]["template"]["spec"]["containers"]
          named = {container.get("name") for container in containers}
          missing = set(images) - named
          if missing:
              raise SystemExit(f"service has no container named {sorted(missing)}; found {sorted(named)}")

          for container in containers:
              container["image"] = images[container["name"]]

          # A revision name carried over from the running revision collides.
          service["spec"]["template"].get("metadata", {}).pop("name", None)

          with open("service.yaml", "w") as handle:
              yaml.safe_dump(service, handle, sort_keys=False)
          PATCH

          gcloud run services replace service.yaml --region "$GCP_REGION" --quiet
        env:
          ARTIFACT_REGISTRY: ${{ secrets.GCP_S8S_ARTIFACT_REGISTRY }}
