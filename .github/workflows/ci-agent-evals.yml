# Shopping agent evals against real dependencies.
#
# The agent's tools are HTTP calls to inventory-service and order-service, so it
# cannot be evaluated without them. This runs the eval inside a mirrord session
# against a cluster that already exists — no environment to stand up, no mocks
# to maintain.
#
# Nothing here selects "mirrord mode". The agent picks its dependencies in
# depsFromEnv(): service URLs present means real HTTP, absent means a frozen
# catalogue fixture. Those URLs come from the target pod's environment, which is
# what the session supplies. Run the same command outside a session and it
# quietly reads the fixture instead — which is the failure this whole demo is
# about, so the run banner says which one it used.
name: Agent evals - real dependencies

on:
  push:
    branches:
      - demo/agent-evals
  workflow_dispatch:
    inputs:
      limit:
        description: Cases to run (0 = whole dataset; subsets spread evenly across case classes)
        required: false
        default: "36"
        type: string
      threshold:
        description: Accuracy gate
        required: false
        default: "0.85"
        type: string

concurrency:
  group: ci-agent-evals-${{ github.ref }}
  cancel-in-progress: true

# The job only reads the checkout; it writes nothing back to the repository.
permissions:
  contents: read

jobs:
  eval:
    name: Eval against real dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/shop/chat-service

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/shop/chat-service/package-lock.json

      # EVAL_KUBECONFIG_BASE64 is the eval cluster's kubeconfig, with its
      # current-context already set — generate it with:
      #   gcloud container clusters get-credentials agent-evals-rehearsal \
      #     --zone us-central1-c --project mirrord-test
      #   kubectl config view --raw --minify | base64
      # It is a separate secret from KUBECONFIG_BASE64 so this workflow and the
      # older shop demo can point at different clusters.
      - name: Set up
        id: setup
        run: |
          start=$(date +%s)

          curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/kubectl

          mkdir -p "$HOME/.kube"
          echo "${{ secrets.EVAL_KUBECONFIG_BASE64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl get deployment chat-service -n shop >/dev/null

          curl -fsSL https://raw.githubusercontent.com/metalbear-co/mirrord/main/scripts/install.sh | bash
          npm ci

          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"

      - name: Run eval
        id: eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MIRRORD_CI_API_KEY: ${{ secrets.MIRRORD_CI_API_KEY }}
          EVAL_CONCURRENCY: "8"
        run: |
          start=$(date +%s)
          set +e
          mirrord ci start --config-file ../../../.mirrord/agent-evals.json -- \
            npm run eval -- \
              --limit "${{ github.event.inputs.limit || '36' }}" \
              --threshold "${{ github.event.inputs.threshold || '0.85' }}" \
              --out eval/results/mirrord.json
          code=$?
          set -e
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Stop mirrord session
        if: always()
        run: mirrord ci stop || true

      # The eval writes its own scorecard to the step summary. This adds the
      # part the scorecard cannot know: how long it took to get here from a
      # cold runner with no environment of its own.
      - name: Report timings
        if: always()
        run: |
          {
            echo ""
            echo "### Cost of getting the dependencies"
            echo "| phase | seconds |"
            echo "| --- | ---: |"
            echo "| set up kubectl, mirrord, npm | ${{ steps.setup.outputs.seconds }} |"
            echo "| run the eval in-session | ${{ steps.eval.outputs.seconds }} |"
            echo ""
            echo "No cluster was created for this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            apps/shop/chat-service/eval/results/
            /tmp/mirrord
