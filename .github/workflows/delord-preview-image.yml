# Builds one shop service into a preview image, on demand.
#
# The bot that drives this runs on a laptop with no registry credential: a GitHub App cannot write
# an organization-owned package, and a personal token with `write:packages` is a broader, longer
# lived secret than the job warrants. A workflow can use the repository's own GITHUB_TOKEN, which
# already has exactly this permission and nothing else, so the build happens here instead.
#
# Dispatched with an explicit service and ref rather than triggered by a branch push, so a run
# builds precisely what was asked for and the caller knows the resulting tag before it starts.
name: Preview image (delord)
run-name: "Preview image: ${{ inputs.service || github.ref_name }}"

on:
  # A push to the bot's own branches is the trigger, not workflow_dispatch. Dispatching needs
  # Actions: write on the caller's token; pushing needs only Contents: write, which the caller has
  # anyway to get the branch here. One fewer permission on a long-lived laptop credential.
  push:
    branches: ["delord/**"]
  workflow_dispatch:
    inputs:
      service:
        description: Directory name under apps/shop
        required: true
        type: string
      ref:
        description: Branch or SHA to build
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: delord-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On a dispatch the caller names the service. On a push it is whatever the branch actually
  # changed, so the caller cannot name it wrongly and a push that touches no service builds nothing.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.pick.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - id: pick
        run: |
          if [ -n "${{ inputs.service }}" ]; then
            case "${{ inputs.service }}" in
              */*|.*|"") echo "::error::invalid service name"; exit 1 ;;
            esac
            list='["${{ inputs.service }}"]'
          else
            changed=$(git diff --name-only "origin/${{ github.event.repository.default_branch }}...HEAD" \
                      | awk -F/ '$1=="apps" && $2=="shop" && NF>3 {print $3}' | sort -u)
            list=$(printf '%s\n' $changed | jq -R . | jq -sc .)
          fi
          echo "services=$list" >> "$GITHUB_OUTPUT"
          echo "building: $list"

  image:
    needs: resolve
    if: needs.resolve.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.resolve.outputs.services) }}
    steps:
      - name: Checkout the requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Validate the service
        run: |
          test -f "apps/shop/${{ matrix.service }}/Dockerfile" \
            || { echo "::error::apps/shop/${{ matrix.service }}/Dockerfile not found"; exit 1; }

      - name: Resolve the tag
        id: tag
        run: |
          sha=$(git rev-parse --short=12 HEAD)
          echo "image=ghcr.io/metalbear-co/playground/playground-delord:${{ matrix.service }}-${sha}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/shop/${{ matrix.service }}
          file: ./apps/shop/${{ matrix.service }}/Dockerfile
          # The preview pod runs on the cluster's amd64 nodes, not on the caller's machine.
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha,scope=delord-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=delord-${{ matrix.service }}

      - name: Report the image
        run: |
          echo "${{ steps.tag.outputs.image }}"
          {
            echo "### Preview image"
            echo
            echo '```'
            echo "${{ steps.tag.outputs.image }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
