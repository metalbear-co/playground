# E2E-01 "guest checkout" against the live playground cluster, with the
# changed services running under `mirrord up`.
#
# Nothing is deployed and no cluster is created. The three services on the
# order path (order, payment, delivery) are built on this runner and started
# by one `mirrord up` run (.mirrord/ci/mirrord-up.yaml), each attached to its
# deployment in namespace `shop`. With MIRRORD_CI_API_KEY set, every child
# session registers with the operator as a CI session.
# Playwright then drives the real storefront with
# `baggage: mirrord-session=<key>`, so the header filter and the SQS/Kafka
# queue splits route only this order to the runner's processes. Everything
# else (frontend, inventory, receipt, Postgres, Kafka, SQS, RabbitMQ) is served
# by the cluster as usual, and other users are not affected.
#
# Started by hand: "Run workflow" on the Actions tab, or `gh workflow run
# shop-e2e-mirrord.yml`. The MetalMart R&D dashboard (/shop/cloud-agents, row
# E2E-01) shows the latest run of this workflow, read from the public GitHub
# API, so the run needs no token for the dashboard.
name: Shop E2E - mirrord CI

run-name: >-
  E2E-01 guest checkout (mirrord up)${{ inputs.chaos != 'none' && format(' · chaos {0}', inputs.chaos) || '' }}${{ inputs.compare && ' · vs kind baseline' || '' }}

on:
  workflow_dispatch:
    inputs:
      chaos:
        description: Chaos rule applied to the order-service session before the test (from .mirrord/chaos)
        type: choice
        default: none
        options:
          - none
          - 01-db-slow
          - 02-db-connection-drop
          - 03-db-timeout
          - 04-rabbitmq-drop
          - 05-rabbitmq-slow
          - 06-inventory-svc-slow
      compare:
        description: Also run the kind baseline workflow (full environment build) and put both durations in the summary
        type: boolean
        default: false

concurrency:
  group: shop-e2e-mirrord
  cancel-in-progress: false

env:
  MIRRORD_VERSION: 3.258.0
  MIRRORD_SHA256: 34b89237b8af334d7b1e284be7bc7c0bf43d62f121e4b72cc4e1968db68446f9
  SHOP_URL: https://playground.metalbear.dev/shop
  MIRRORD_UP_LOG: /tmp/mirrord/up.log
  MIRRORD_UP_PID: /tmp/mirrord/up.pid
  E2E_RESULTS_FILE: /tmp/e2e/results.json

jobs:
  e2e:
    name: E2E-01 guest checkout (mirrord up)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate the per-run session key
        # The key is the only thing that routes traffic into this run's local
        # processes. Its random part keeps it unguessable while the run is live
        # (run ids and logs are public) and is masked in the logs. The run id
        # part stays readable, so the mirrord logs below still show which key
        # the header filter and the stolen requests carry.
        run: |
          set -euo pipefail
          rand="$(openssl rand -hex 6)"
          echo "::add-mask::$rand"
          echo "E2E_SESSION_KEY=e2e-${{ github.run_id }}-$rand" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/shop/order-service/package-lock.json
            apps/shop/payment-service/package-lock.json
            apps/shop/delivery-service/package-lock.json
            apps/shop/e2e/package-lock.json

      - name: Build the services on the order path
        run: |
          set -euo pipefail
          for svc in order-service payment-service delivery-service; do
            echo "::group::build $svc"
            (cd "apps/shop/$svc" && npm ci && npm run build)
            echo "::endgroup::"
          done

      - name: Install Playwright
        working-directory: apps/shop/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: playground-cluster-1
          location: us-central1-c
          project_id: playground-383912

      - name: Install mirrord ${{ env.MIRRORD_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL -o mirrord.zip "https://github.com/metalbear-co/mirrord/releases/download/${MIRRORD_VERSION}/mirrord_linux_x86_64.zip"
          echo "${MIRRORD_SHA256}  mirrord.zip" | sha256sum -c
          unzip -o mirrord.zip
          sudo mv mirrord /usr/local/bin/mirrord
          sudo chmod +x /usr/local/bin/mirrord
          mirrord --version

      - name: Start the services with mirrord up
        env:
          MIRRORD_CI_API_KEY: ${{ secrets.MIRRORD_CI_API_KEY }}
          MIRRORD_CHECK_VERSION: "false"
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$MIRRORD_UP_LOG")"
          # `mirrord up` stays in the foreground until a child session exits, so
          # it runs in its own process group and the cleanup step terminates
          # the group. Each child's output is prefixed with its service name.
          setsid nohup mirrord up -f .mirrord/ci/mirrord-up.yaml --key "$E2E_SESSION_KEY" > "$MIRRORD_UP_LOG" 2>&1 &
          echo $! > "$MIRRORD_UP_PID"
          echo "mirrord up pid $(cat "$MIRRORD_UP_PID")"

      - name: Wait for the local services to be ready
        run: |
          set -euo pipefail
          wait_for() {
            local marker="$1" deadline=$(( $(date +%s) + 180 ))
            while [ "$(date +%s)" -lt "$deadline" ]; do
              if grep -qF -- "$marker" "$MIRRORD_UP_LOG"; then echo "ready: $marker"; return 0; fi
              if ! kill -0 "$(cat "$MIRRORD_UP_PID")" 2>/dev/null; then echo "mirrord up exited early"; cat "$MIRRORD_UP_LOG"; return 1; fi
              sleep 2
            done
            echo "timed out waiting for: $marker"; cat "$MIRRORD_UP_LOG"; return 1
          }
          wait_for "order-service: [Order] Listening on port"
          wait_for "payment-service: Payment service listening on port"
          wait_for "delivery-service: Delivery service listening on port"
          grep -F ": session ID:" "$MIRRORD_UP_LOG"

      - name: Show the mirrord up startup log
        # Everything `mirrord up` and the three services printed so far, each
        # line prefixed with its service name: the operator session per
        # service, its config summary (target, steal, env, fs, dns) and the
        # session key. The output that follows during the test is printed
        # after the test.
        run: |
          set -euo pipefail
          cat "$MIRRORD_UP_LOG"
          echo "MIRRORD_UP_STARTUP_LINES=$(wc -l < "$MIRRORD_UP_LOG")" >> "$GITHUB_ENV"

      - name: Wait for the cluster queue consumers to settle
        # Queue splitting makes the operator restart the cluster payment-service
        # and delivery-service pods so they consume from their fallback queues.
        # Until the old pods are gone they still read the original queue and
        # would take this run's messages instead of the local services.
        run: |
          set -euo pipefail
          kubectl rollout status -n shop deployment/payment-service  --timeout=180s
          kubectl rollout status -n shop deployment/delivery-service --timeout=180s
          for app in payment-service delivery-service; do
            deadline=$(( $(date +%s) + 120 ))
            while kubectl get pods -n shop -l "app=$app" -o jsonpath='{.items[*].metadata.deletionTimestamp}' | grep -q .; do
              [ "$(date +%s)" -lt "$deadline" ] || { echo "old $app pods still terminating"; exit 1; }
              sleep 3
            done
            echo "$app: only the patched pods remain"
          done
          kubectl get pods -n shop -l 'app in (payment-service,delivery-service)'

      - name: Apply chaos rule to the order-service session
        if: inputs.chaos != 'none'
        env:
          RULE: .mirrord/chaos/${{ inputs.chaos }}.json
        run: |
          set -euo pipefail
          # `mirrord up` prints each child's operator session id, prefixed with
          # the service name: "order-service: session ID: <id>".
          SESSION_ID="$(grep -F 'order-service: session ID:' "$MIRRORD_UP_LOG" | head -n1 | awk '{print $NF}')"
          [ -n "$SESSION_ID" ] || { echo "no order-service session id in $MIRRORD_UP_LOG"; cat "$MIRRORD_UP_LOG"; exit 1; }
          echo "applying $RULE to session $SESSION_ID"
          mirrord chaos add --session-id "$SESSION_ID" --file-path "$RULE"

      - name: Run E2E-01 (Playwright against the live storefront)
        id: e2e
        working-directory: apps/shop/e2e
        env:
          PLAYWRIGHT_HTML_REPORT: /tmp/e2e/playwright-report
          PLAYWRIGHT_OUTPUT_DIR: /tmp/e2e/test-results
        run: npx playwright test

      - name: Verify which hops ran on this runner
        id: hops
        if: always() && steps.e2e.outcome != 'skipped'
        run: ./apps/shop/e2e/scripts/assert-local-logs.sh "$E2E_RESULTS_FILE"

      - name: Show what mirrord did during the test
        # The local services' output for the test's order, then each service's
        # internal proxy log rendered one event per line: the operator
        # session, the steal subscription with the header filter, every
        # stolen HTTP request with its headers (the baggage header carries the
        # session key), outgoing connections to the cluster, and the log
        # messages the agent sent back.
        if: always() && steps.e2e.outcome != 'skipped'
        run: |
          set -euo pipefail
          echo "== local service output during the test"
          tail -n "+$(( ${MIRRORD_UP_STARTUP_LINES:-0} + 1 ))" "$MIRRORD_UP_LOG"
          for svc in order-service payment-service delivery-service; do
            echo
            echo "== mirrord internal proxy log: $svc"
            ./apps/shop/e2e/scripts/render-intproxy-log.sh "/tmp/mirrord/intproxy-$svc.log"
          done

      - name: Stop mirrord up
        if: always()
        run: |
          pid="$(cat "$MIRRORD_UP_PID" 2>/dev/null || true)"
          if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then
            # Terminate the whole process group: mirrord up and its three services.
            kill -TERM -- "-$pid" || true
            for _ in $(seq 1 15); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
            kill -KILL -- "-$pid" 2>/dev/null || true
          fi

      - name: Write job summary
        id: summary
        if: always()
        run: |
          if [ "${{ steps.e2e.outcome }}" = "success" ] && [ "${{ steps.hops.outcome }}" = "success" ]; then
            echo "outcome=success" >> "$GITHUB_OUTPUT"; outcome=success
          else
            echo "outcome=failure" >> "$GITHUB_OUTPUT"; outcome=failure
          fi
          ./apps/shop/e2e/scripts/write-summary.sh "$E2E_RESULTS_FILE" "$outcome" "${{ inputs.chaos }}"

      - name: Upload the mirrord up and internal proxy logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirrord-logs
          path: /tmp/mirrord
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-01-playwright
          path: /tmp/e2e
          if-no-files-found: ignore
          retention-days: 14

  baseline:
    name: Baseline (full kind environment build)
    # Starts the older demo workflow, whose `Full Environment Setup` job builds
    # a kind cluster on its runner (Postgres, Kafka, LocalStack, images, seed
    # data) before it runs one curl test, waits for it, and writes its duration
    # next to the E2E-01 job's duration in this run's summary.
    if: inputs.compare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      BASELINE_WORKFLOW: ci-demo-shop-mirrord-vs-baseline.yml
      BASELINE_JOB: Full Environment Setup
      E2E_JOB: E2E-01 guest checkout (mirrord up)
    steps:
      - name: Start the kind baseline workflow
        id: start
        run: |
          set -euo pipefail
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run "$BASELINE_WORKFLOW" --repo "$REPO" --ref main
          # The dispatch call returns no run id: take the first dispatch run
          # of that workflow created after the call.
          run_id=""
          for _ in $(seq 1 20); do
            sleep 3
            run_id="$(gh run list --repo "$REPO" --workflow "$BASELINE_WORKFLOW" --event workflow_dispatch --limit 5 --json databaseId,createdAt \
              | jq -r --arg before "$before" '[.[] | select(.createdAt >= $before)] | first | .databaseId // empty')"
            [ -n "$run_id" ] && break
          done
          [ -n "$run_id" ] || { echo "no run of $BASELINE_WORKFLOW appeared after the dispatch"; exit 1; }
          echo "baseline run: https://github.com/$REPO/actions/runs/$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for the baseline run and the E2E-01 job
        env:
          BASELINE_RUN_ID: ${{ steps.start.outputs.run_id }}
        run: |
          set -euo pipefail
          # Prints one line per job per poll until both have finished.
          job_state() { # <run id> <job name> -> "<status> <conclusion> <startedAt> <completedAt>"
            gh run view "$1" --repo "$REPO" --json jobs \
              | jq -r --arg name "$2" '.jobs[] | select(.name == $name) | "\(.status) \(.conclusion // "-") \(.startedAt // "-") \(.completedAt // "-")"'
          }
          deadline=$(( $(date +%s) + 25 * 60 ))
          while :; do
            b="$(job_state "$BASELINE_RUN_ID" "$BASELINE_JOB")"
            e="$(job_state "$GITHUB_RUN_ID" "$E2E_JOB")"
            echo "$(date -u +%H:%M:%S)  kind baseline: ${b:-not started}   |   mirrord up: ${e:-not started}"
            case "$b $e" in completed*completed*) break ;; esac
            [ "$(date +%s)" -lt "$deadline" ] || { echo "timed out waiting for the jobs"; break; }
            sleep 20
          done
          echo "BASELINE_STATE=$b" >> "$GITHUB_ENV"
          echo "E2E_STATE=$e" >> "$GITHUB_ENV"

      - name: Write the comparison into the summary
        if: always() && steps.start.outputs.run_id != ''
        env:
          BASELINE_RUN_ID: ${{ steps.start.outputs.run_id }}
        run: |
          set -euo pipefail
          dur() { # <startedAt> <completedAt> -> "Xm YYs" or "-"
            [ "$1" != "-" ] && [ "$2" != "-" ] || { echo "-"; return; }
            local s=$(( $(date -u -d "$2" +%s) - $(date -u -d "$1" +%s) ))
            printf '%dm %02ds' $(( s / 60 )) $(( s % 60 ))
          }
          read -r b_status b_conc b_start b_end <<< "${BASELINE_STATE:-- - - -}"
          read -r e_status e_conc e_start e_end <<< "${E2E_STATE:-- - - -}"
          b_dur="$(dur "$b_start" "$b_end")"; e_dur="$(dur "$e_start" "$e_end")"
          {
            echo "## Baseline comparison"
            echo
            echo "| Job | What it builds | Result | Duration |"
            echo "|---|---|---|---|"
            echo "| [$BASELINE_JOB](https://github.com/$REPO/actions/runs/$BASELINE_RUN_ID) | kind cluster on the runner: Postgres, Kafka, LocalStack, service images, seed data, then one curl test | $b_conc | **$b_dur** |"
            echo "| $E2E_JOB (this run) | nothing: order, payment and delivery run on the runner under \`mirrord up\`, attached to the live cluster; the browser drives the real storefront | $e_conc | **$e_dur** |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
