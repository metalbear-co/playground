# SOL-211 — MetalMart V2. Run from the repo root:
#   mirrord up -f mirrord-up-sol-211.yaml --key <session-key>
# split mode: only requests with `baggage: mirrord-session=<key>` reach the local processes.
services:
  order-service:
    target: { path: deployment/order-service, namespace: shop }
    http_filter:
      header_filter: 'baggage:\s*[^\n]*\bmirrord-session={{ key }}\b'
    run:
      command: ["npm", "--prefix", "apps/shop/order-service", "run", "dev"]
  chat-service:
    target: { path: deployment/chat-service, namespace: shop }
    http_filter:
      header_filter: 'baggage:\s*[^\n]*\bmirrord-session={{ key }}\b'
    env:
      override:
        PORT: "8083"                     # order-service already binds local port 80
    config_patch:
      feature:
        network:
          incoming:
            port_mapping: [[8083, 80]]   # [local, remote]
        split_queues:
          "*":
            queue_type: Kafka
            message_filter:
              baggage: '.*mirrord-session={{ key }}.*'
    run:
      command: ["npm", "--prefix", "apps/shop/chat-service", "run", "dev"]
  inventory-service:
    target: { path: deployment/inventory-service, namespace: shop }
    http_filter:
      header_filter: 'baggage:\s*[^\n]*\bmirrord-session={{ key }}\b'
    env:
      override:
        PORT: "8084"                     # 80 and 8083 are taken locally
    config_patch:
      feature:
        network:
          incoming:
            port_mapping: [[8084, 80]]   # [local, remote]
    run:
      command: ["npm", "--prefix", "apps/shop/inventory-service", "run", "dev"]
  metal-mart-frontend:
    target: { path: deployment/metal-mart-frontend, namespace: shop }
    http_filter:
      header_filter: 'baggage:\s*[^\n]*\bmirrord-session={{ key }}\b'
    env:
      override:
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: dxas4fpir
    run:
      command: ["npm", "--prefix", "apps/shop/metal-mart-frontend", "run", "dev", "--", "-p", "3000"]
