---
# mirrord Operator, managed by ArgoCD from the published Helm chart.
#
# Upgrading the operator is a one-line change to `targetRevision` below; ArgoCD
# renders the pinned chart and rolls the Deployment. Available versions:
# https://github.com/metalbear-co/charts/releases
#
# Secrets are never in this file. The chart reads them from Secrets that exist
# in the `mirrord` namespace and are created out of band:
#   mirrord-operator-cloud-api-key  (data key `apiKey`)   -> cloud.apiKey.keyRef
#   mirrord-operator-license        (OPERATOR_LICENSE_KEY) -> license.keyRef
#   aws-credentials                                       -> operator.extraEnv
#
# There is deliberately no `resources-finalizer.argocd.argoproj.io` finalizer:
# deleting this Application must leave the operator running, never cascade.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mirrord-operator
  namespace: argocd
spec:
  project: default
  destination:
    namespace: mirrord
    server: https://kubernetes.default.svc
  source:
    repoURL: https://metalbear-co.github.io/charts
    chart: mirrord-operator
    targetRevision: 3.223.0
    helm:
      # Must stay `mirrord-operator`: the chart stamps the release name into
      # the `app.kubernetes.io/instance` label on every object.
      releaseName: mirrord-operator
      valuesObject:
        namespace: mirrord
        # The namespace is shared with the license server and is not owned by
        # this Application, so pruning can never remove it.
        createNamespace: false

        cloud:
          apiKey:
            keyRef: mirrord-operator-cloud-api-key

        license:
          # Inert while cloud.apiKey is set; kept only until the cloud key has
          # been in use long enough to drop the legacy license entirely.
          keyRef: mirrord-operator-license
          allowSeatOverages: true

        operator:
          # Leader plus one standby, so a chart bump rolls without a gap.
          replicas: 2
          # The shop Application self-heals; without this the operator's
          # queue-splitting patches on target workloads get reverted by Argo.
          applicationPauseAutoSync: true
          jsonLog: true
          sqsSplitting: true
          rmqSplitting: true
          kafkaSplitting: true
          gcpPubsubSplitting: true
          temporalSplitting: true
          pgBranching: true
          genericBranching: true
          genericBranchConfig:
            dbPod:
              allowedImages:
                - "docker.elastic.co/elasticsearch/elasticsearch:*"
                - "docker.io/scylladb/scylla:*"
            profiles:
              team-search:
                dbPod:
                  resources:
                    requests:
                      cpu: "250m"
                      memory: "1Gi"
                    limits:
                      cpu: "1"
                      memory: "2Gi"
              # Carries the whole ScyllaDB setup, so a mirrord.json only needs
              # type, id, profile, and the connection host and port.
              scylla:
                dbPod:
                  resources:
                    requests:
                      cpu: "250m"
                      memory: "1Gi"
                    limits:
                      cpu: "1"
                      memory: "2Gi"
                  branch:
                    image: docker.io/scylladb/scylla:2026.3.4
                    port: 9042
                    # Under the 2Gi limit, --memory 1G fails at startup unless
                    # --reserve-memory lowers the default reservation.
                    args:
                      - --smp
                      - "1"
                      - --memory
                      - 1G
                      - --reserve-memory
                      - 256M
                      - --overprovisioned
                      - "1"
                      - --developer-mode
                      - "1"
                      - --reactor-backend
                      - epoll
                    readiness:
                      exec:
                        command:
                          - cqlsh
                          - -e
                          - SELECT now() FROM system.local
                  # Kubernetes expands $(VAR) in args, so the script uses ${VAR} only.
                  copy:
                    image: docker.io/scylladb/scylla:2026.3.4
                    command:
                      - bash
                      - -c
                    args:
                      - |
                        set -euo pipefail
                        ks=catalog
                        src="${MIRRORD_PARAM_HOST} ${MIRRORD_PARAM_PORT}"
                        dst="${MIRRORD_BRANCH_HOST} ${MIRRORD_BRANCH_PORT}"
                        cqlsh $src -e "DESCRIBE KEYSPACE ${ks}" \
                          | sed -E "/CREATE KEYSPACE/s/\{[^}]*\}/{'class': 'NetworkTopologyStrategy', 'replication_factor': 1}/" \
                          > /tmp/schema.cql
                        cqlsh $dst -f /tmp/schema.cql
                        cqlsh $src -e "SELECT table_name FROM system_schema.tables WHERE keyspace_name = '${ks}'" \
                          | sed -E "1,3d; /^\s*$/d; /rows?\)/d; s/\s+//g" \
                          > /tmp/tables
                        while read -r t; do
                          cqlsh $src -e "COPY ${ks}.${t} TO '/tmp/${t}.csv'"
                          cqlsh $dst -e "COPY ${ks}.${t} FROM '/tmp/${t}.csv'"
                        done < /tmp/tables
          previewEnv: true
          topology: true
          shareIngress:
            # Must match shareIngress.shareDomain on the mirrord-share-ingress Application.
            shareDomain: preview.playground.metalbear.dev
          # SQS splitting credentials.
          extraEnv:
            AWS_REGION: us-east-1
            AWS_ACCESS_KEY_ID:
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: aws-access-key-id
            AWS_SECRET_ACCESS_KEY:
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: aws-secret-access-key

        agent:
          injectHeaders: true
          extraConfig:
            inject_headers: true
            privileged: true

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ServerSideApply=true
