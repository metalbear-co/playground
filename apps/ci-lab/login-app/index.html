<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account portal</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f1ea;
        color: #1c1917;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, serif;
      }
      main {
        width: min(420px, calc(100% - 32px));
        padding: 32px;
        background: white;
        border: 1px solid #e7e5e4;
        border-radius: 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 32px;
      }
      p.lede {
        margin: 0 0 24px;
        color: #57534e;
      }
      form {
        display: grid;
        gap: 16px;
      }
      label {
        display: grid;
        gap: 6px;
        font-size: 14px;
      }
      input {
        padding: 10px 12px;
        border: 1px solid #d6d3d1;
        border-radius: 8px;
        font: inherit;
      }
      button {
        padding: 12px 16px;
        border: 0;
        border-radius: 8px;
        background: #1c1917;
        color: white;
        font: inherit;
        cursor: pointer;
      }
      [role="status"] {
        margin-top: 20px;
        padding: 12px;
        border-radius: 8px;
        background: #ecfdf3;
      }
      [role="alert"] {
        margin-top: 20px;
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
