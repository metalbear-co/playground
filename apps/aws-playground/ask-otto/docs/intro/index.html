<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How it works · mirrord serverless on Amazon ECS</title>
<style>
  :root {
    --ink: #232f3e;
    --muted: #545b64;
    --line: #d5dbdb;
    --cloud: #232f3e;
    --vpc: #7a70b8;
    --compute: #ed7100;
    --alb: #7a70b8;
    --alb-fill: #f3f0fa;
    --db: #3b48cc;
    --subnet: #147eba;
    --mirrord: #6b5ce7;
    --bad: #d13212;
    --good: #1d8102;
    --bg: #f7f8fa;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  .deck { position: fixed; inset: 0; overflow: hidden; }
  .stage { width: 1280px; height: 720px; position: absolute; left: 50%; top: 50%; transform-origin: center;
    padding: 40px 48px; display: flex; flex-direction: column; }
  .kicker { color: var(--mirrord); font-weight: 650; text-transform: uppercase; letter-spacing: 2px; font-size: 14px; margin-bottom: 8px; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  .arch { display: grid; grid-template-columns: 1fr 320px; gap: 20px; height: 100%; }
  svg { overflow: visible; }
  svg text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  .grp-label { font-size: 13px; font-weight: 700; letter-spacing: .3px; }
  .aws-chip { font-size: 12.5px; font-weight: 700; fill: #fff; letter-spacing: .35px; }
  .aws-meta { font-size: 12.5px; font-weight: 650; }
  .box-label { font-size: 14px; font-weight: 700; fill: var(--ink); }
  .box-sub { font-size: 11.5px; fill: var(--muted); }
  .flow { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
    opacity: 0; transition: opacity .3s; }
  .flow.on { opacity: 1; }
  .flow.ctrl { stroke: var(--mirrord); }
  .flow.data { stroke: var(--mirrord); stroke-dasharray: 8 6; animation: march .9s linear infinite; }
  .flow.rds { stroke: var(--db); stroke-dasharray: 8 6; animation: march .9s linear infinite; }
  .flow.live { stroke: #687078; }
  .flow.steal { stroke: var(--mirrord); }
  .flow.bad { stroke: var(--bad); stroke-dasharray: 6 6; }
  @keyframes march { to { stroke-dashoffset: -28; } }
  .badge { opacity: 0; transition: opacity .3s; pointer-events: none; }
  .badge.on { opacity: 1; }
  .packet { opacity: 0; }
  .packet.on { opacity: 1; }
  .hl { transition: stroke .25s, stroke-width .25s; }
  .hl.on { stroke: var(--mirrord); stroke-width: 2.75; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; }
  .panel ol { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 4px; }
  .panel li { padding: 8px 10px; border-radius: 8px; font-size: 14.5px; color: var(--muted); cursor: pointer; display: flex; gap: 8px; }
  .panel li b { color: var(--line); min-width: 16px; }
  .panel li.on { background: #f3f0ff; color: var(--ink); }
  .panel li.on b { color: var(--mirrord); }
  .caption { font-size: 15.5px; line-height: 1.5; border-top: 1px solid var(--line); padding-top: 12px; min-height: 148px; }
  .caption code { background: #f2f3f5; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .hint { margin-top: auto; color: var(--muted); font-size: 12.5px; }
  .live { display: none; margin: 0 0 12px; padding: 10px 12px; border-radius: 10px;
    background: #f3f0ff; border: 1px solid #c4b8f5; }
  .live.on { display: block; }
  .live-kicker { color: var(--mirrord); font-weight: 650; text-transform: uppercase;
    letter-spacing: 1.2px; font-size: 11px; margin-bottom: 4px; }
  .live-q { font-size: 15px; line-height: 1.35; color: var(--ink); }
</style>
</head>
<body>
<div class="deck"><div class="stage" id="stage">
  <div class="kicker">How it works</div>
  <div class="arch">
    <svg viewBox="0 0 1200 600" width="100%" height="100%" aria-label="Architecture">
      <defs>
        <marker id="ah-ctrl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="#6b5ce7"/>
        </marker>
        <marker id="ah-live" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="#687078"/>
        </marker>
        <marker id="ah-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="#d13212"/>
        </marker>
        <marker id="ah-rds" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="#3b48cc"/>
        </marker>
      </defs>

      <!-- ── Developer laptop (outside AWS) ── -->
      <rect x="8" y="128" width="204" height="300" rx="10" fill="#eaeded" stroke="#aab7b8"/>
      <text x="22" y="152" class="grp-label" fill="#545b64">Developer laptop</text>

      <rect id="hl-exec" class="hl" x="22" y="166" width="176" height="188" rx="8" fill="#f3f0ff" stroke="#c4b8f5"/>
      <image href="mirrord-mascot.png" x="28" y="172" width="36" height="66" preserveAspectRatio="xMidYMid meet"/>
      <text x="70" y="198" class="box-label">mirrord exec</text>
      <text x="70" y="216" class="box-sub">agent on the laptop</text>
      <rect x="36" y="246" width="148" height="68" rx="7" fill="#fff" stroke="#c4b8f5"/>
      <text x="110" y="274" text-anchor="middle" class="box-label">Ask Otto</text>
      <text id="laptop-sub" x="110" y="294" text-anchor="middle" class="box-sub">your local code</text>
      <text x="110" y="404" text-anchor="middle" class="box-sub mono" style="font-size:10.5px">baggage: mirrord-session</text>
      <text x="110" y="418" text-anchor="middle" class="box-sub mono" style="font-size:10.5px">=ask-otto</text>

      <!-- ── AWS Cloud (squid ink) → VPC (purple) ── -->
      <rect x="248" y="20" width="940" height="548" rx="6" fill="none" stroke="var(--cloud)" stroke-width="2" stroke-dasharray="8 5"/>
      <rect x="260" y="28" width="176" height="22" rx="4" fill="var(--cloud)"/>
      <text x="272" y="44" class="aws-chip">AWS Cloud · us-east-1</text>

      <rect x="264" y="58" width="908" height="428" rx="6" fill="#fff" stroke="var(--vpc)" stroke-width="2"/>
      <rect x="276" y="68" width="48" height="22" rx="4" fill="var(--vpc)"/>
      <text x="286" y="84" class="aws-chip">VPC</text>
      <text x="332" y="84" class="aws-meta" fill="var(--vpc)">10.80.0.0/16 · staging</text>

      <!-- ALB — AWS purple network, aligned over the task -->
      <text x="1044" y="14" text-anchor="middle" class="aws-meta" fill="var(--ink)">Customers</text>
      <rect x="784" y="100" width="360" height="40" rx="6" fill="var(--alb-fill)" stroke="var(--alb)" stroke-width="1.75"/>
      <g transform="translate(796,108)" fill="#7a70b8">
        <polygon points="10,1 18,5.5 18,14.5 10,19 2,14.5 2,5.5"/>
      </g>
      <text x="824" y="126" class="box-label" fill="var(--alb)">Application Load Balancer</text>

      <!-- sessions-manager: mirrord matchmaker, not the agent -->
      <rect id="hl-op" class="hl" x="284" y="196" width="236" height="140" rx="8" fill="#f3f0ff" stroke="var(--mirrord)"/>
      <circle cx="306" cy="218" r="8" fill="none" stroke="#6b5ce7" stroke-width="1.8"/>
      <circle cx="306" cy="218" r="2.2" fill="#6b5ce7"/>
      <text x="322" y="223" class="box-label">sessions-manager</text>
      <text x="402" y="252" text-anchor="middle" class="box-sub">the matchmaker · Fargate on s8s</text>
      <text x="402" y="272" text-anchor="middle" class="box-sub">both sides dial out over HTTPS</text>
      <text x="402" y="304" text-anchor="middle" class="box-sub mono" style="font-size:10px">session-manager.aws-playground</text>
      <text x="402" y="318" text-anchor="middle" class="box-sub mono" style="font-size:10px">.metalbear.dev</text>

      <g class="badge" id="b-paired">
        <rect x="308" y="348" width="188" height="28" rx="14" fill="var(--mirrord)"/>
        <text x="402" y="367" text-anchor="middle" fill="#fff" style="font-size:12px;font-weight:650">paired · staging/ask-otto</text>
      </g>

      <!-- ECS Fargate task — AWS orange compute -->
      <rect x="784" y="156" width="360" height="208" rx="8" fill="#fff6ee" stroke="var(--compute)" stroke-width="2" stroke-dasharray="6 4"/>
      <rect x="796" y="166" width="168" height="22" rx="4" fill="var(--compute)"/>
      <text x="808" y="182" class="aws-chip">Amazon ECS · Fargate</text>

      <rect x="800" y="196" width="328" height="148" rx="7" fill="#fff" stroke="#ed7100"/>
      <rect id="hl-comp" class="hl" x="816" y="216" width="144" height="112" rx="7" fill="#f3f0ff" stroke="#c4b8f5"/>
      <image href="mirrord-mascot.png" x="822" y="226" width="34" height="62" preserveAspectRatio="xMidYMid meet"/>
      <text x="860" y="256" class="box-label">companion</text>
      <text x="860" y="276" class="box-sub">mirrord agent</text>
      <text x="860" y="296" class="box-sub mono" style="font-size:10.5px">LD_PRELOAD</text>
      <rect x="968" y="216" width="144" height="112" rx="7" fill="#fff" stroke="#d5dbdb"/>
      <text x="1040" y="266" text-anchor="middle" class="box-label">Ask Otto</text>
      <text x="1040" y="286" text-anchor="middle" class="box-sub">live service</text>

      <!-- Private subnet + RDS — AWS blue database. Same nesting as ECS: chip in the header, resource below. -->
      <rect x="784" y="368" width="360" height="110" rx="8" fill="#f3f8fc" stroke="var(--subnet)" stroke-width="2" stroke-dasharray="6 4"/>
      <rect x="796" y="376" width="124" height="22" rx="4" fill="var(--subnet)"/>
      <text x="808" y="392" class="aws-chip">Private subnet</text>
      <rect x="800" y="406" width="328" height="64" rx="7" fill="#fff" stroke="var(--db)" stroke-width="2"/>
      <g transform="translate(816,418)">
        <path d="M0 8 v22 a14 8 0 0 0 28 0 V8" fill="#d9def8" stroke="#3b48cc" stroke-width="1.8"/>
        <ellipse cx="14" cy="8" rx="14" ry="8" fill="#3b48cc"/>
      </g>
      <text x="856" y="438" class="box-label" fill="var(--db)">Amazon RDS</text>
      <text x="856" y="456" class="box-sub">PostgreSQL · 5432 from task SG</text>
      <g class="badge" id="b-client">
        <rect x="800" y="478" width="328" height="22" rx="11" fill="var(--good)"/>
        <text x="964" y="494" text-anchor="middle" fill="#fff" style="font-size:11.5px;font-weight:650">client = the task’s private IP</text>
      </g>

      <!-- 1 locked: in the AWS Cloud footer, below the VPC, clear of the black dashes -->
      <path id="f-locked" class="flow bad" marker-end="url(#ah-bad)"
            d="M110 428 L110 520 L964 520 L964 470"/>
      <g class="badge" id="b-locked">
        <circle cx="560" cy="520" r="11" fill="#fff" stroke="var(--bad)" stroke-width="2"/>
        <path d="M555 515 L565 525 M565 515 L555 525" stroke="var(--bad)" stroke-width="2.5" fill="none"/>
        <text x="542" y="516" text-anchor="end" fill="var(--bad)" style="font-size:12px;font-weight:650">timed out</text>
      </g>

      <!-- 2 companion → sessions-manager. Corridor between the two boxes. -->
      <path id="f-task" class="flow ctrl" marker-end="url(#ah-ctrl)"
            d="M816 272 L520 272"/>
      <text class="badge" id="l-task" x="668" y="260" text-anchor="middle" fill="#6b5ce7" style="font-size:11px;font-weight:650">HTTPS check-in</text>

      <!-- 3 laptop → sessions-manager. Corridor in the laptop–VPC gutter. -->
      <path id="f-laptop" class="flow ctrl" marker-end="url(#ah-ctrl)"
            d="M198 230 L284 230"/>
      <text class="badge" id="l-laptop" x="241" y="218" text-anchor="middle" fill="#6b5ce7" style="font-size:11px;font-weight:650">HTTPS</text>

      <!-- 4 steal: ALB left → empty VPC row → gutter → into mirrord exec. -->
      <path id="f-steal" class="flow steal" marker-end="url(#ah-ctrl)"
            d="M784 120 L232 120 L232 230 L198 230"/>
      <text class="badge" id="l-steal" x="508" y="108" text-anchor="middle" fill="#6b5ce7" style="font-size:11px;font-weight:650">steal · baggage: mirrord-session=ask-otto</text>

      <!-- 5 data plane: local Otto → under the matchmaker → companion → RDS. -->
      <path id="f-out" class="flow data"
            d="M184 280 L232 280 L232 370 L888 370 L888 328"/>
      <path id="f-rds" class="flow rds" marker-end="url(#ah-rds)"
            d="M888 328 L888 406"/>
      <text class="badge" id="l-data" x="520" y="366" text-anchor="middle" fill="#6b5ce7" style="font-size:11px;font-weight:650">tunneled query · not via sessions-manager</text>

      <!-- 6 customers → ALB → live Otto (two segments so the ALB isn’t crossed as one stroke) -->
      <path id="f-live-in" class="flow live" marker-end="url(#ah-live)" d="M1040 20 L1040 100"/>
      <path id="f-live-svc" class="flow live" marker-end="url(#ah-live)" d="M1040 140 L1040 216"/>

      <circle id="pkt-out" class="packet" r="6" fill="#6b5ce7">
        <animateMotion dur="3s" repeatCount="indefinite">
          <mpath href="#f-out"/>
        </animateMotion>
      </circle>
      <circle id="pkt-live" class="packet" r="5" fill="#687078">
        <animateMotion dur="1.6s" repeatCount="indefinite" path="M1040 20 L1040 216"/>
      </circle>
    </svg>

    <div class="panel">
      <div class="live" id="live">
        <div class="live-kicker">On your laptop</div>
        <div class="live-q" id="live-q"></div>
      </div>
      <ol id="arch-steps">
        <li><b>0</b>The layout</li>
        <li><b>1</b>Locked out</li>
        <li><b>2</b>The companion checks in</li>
        <li><b>3</b>The laptop checks in</li>
        <li><b>4</b>Tagged traffic stolen</li>
        <li><b>5</b>Outbound to RDS</li>
        <li><b>6</b>Live service untouched</li>
      </ol>
      <div class="caption" id="arch-caption"></div>
      <div class="hint">← → to step through · 0–6 to jump</div>
    </div>
  </div>
</div></div>

<script>
  let step = 0;

  const captions = [
    'Ask Otto runs on <b>ECS Fargate</b> in the playground <b>s8s</b> VPC, next to private <b>Amazon RDS</b>. The matchmaker is <b>sessions-manager</b>, also on Fargate. No EKS, no Transit Gateway, no Resolver.',
    'From the laptop, RDS is unreachable. It has no public address, and nothing routes from the laptop into the VPC. That is the normal, correct setup.',
    'When the task starts, <code>LD_PRELOAD</code> loads the mirrord agent beside Otto. The companion connects <b>out</b> over HTTPS and checks in as <code>staging/ask-otto</code>. Nothing dials in.',
    'The developer runs <code>mirrord exec</code>. The laptop checks in with the same sessions-manager. It pairs them. Neither side needs a network path to the other.',
    'The browser extension tags Maya’s requests with <code>baggage: mirrord-session=ask-otto</code>. The load balancer still receives them; mirrord <b>steals</b> only those to her laptop.',
    'Local Otto connects to the RDS hostname. mirrord sends that through the companion, which opens it from inside the task. RDS sees the <b>task’s private IP</b>. The path never goes through sessions-manager.',
    'Everyone else still hits the load balancer and the deployed service. When the fix works, it ships with one normal deploy.',
  ];

  const archState = [
    {},
    { flows: ['f-locked'], badges: ['b-locked'] },
    { flows: ['f-task'], badges: ['l-task'], hl: ['hl-comp', 'hl-op'] },
    { flows: ['f-task', 'f-laptop'], badges: ['b-paired', 'l-task', 'l-laptop'], hl: ['hl-exec', 'hl-op', 'hl-comp'] },
    { flows: ['f-steal'], badges: ['b-paired', 'l-steal'], hl: ['hl-exec'] },
    { flows: ['f-out', 'f-rds'], badges: ['b-paired', 'b-client', 'l-data'], packets: ['pkt-out'], hl: ['hl-exec', 'hl-comp'] },
    { flows: ['f-live-in', 'f-live-svc', 'f-out', 'f-rds'], badges: ['b-client'], packets: ['pkt-live', 'pkt-out'] },
  ];
  const last = archState.length - 1;

  let liveOn = false;

  function render() {
    const st = archState[step];
    document.querySelectorAll('.flow').forEach(el => el.classList.toggle('on', (st.flows || []).includes(el.id)));
    document.querySelectorAll('.badge').forEach(el => el.classList.toggle('on', (st.badges || []).includes(el.id)));
    document.querySelectorAll('.packet').forEach(el => el.classList.toggle('on', (st.packets || []).includes(el.id)));
    document.querySelectorAll('.hl').forEach(el => el.classList.toggle('on', (st.hl || []).includes(el.id)));
    if (liveOn) document.getElementById('hl-exec').classList.add('on');
    document.querySelectorAll('#arch-steps li').forEach((li, i) => li.classList.toggle('on', i === step));
    document.getElementById('arch-caption').innerHTML = captions[step];
  }

  function go(s) { step = Math.max(0, Math.min(last, s)); render(); }

  document.addEventListener('keydown', e => {
    if (['ArrowRight', ' ', 'PageDown', 'Enter'].includes(e.key)) { e.preventDefault(); go(step + 1); }
    else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); go(step - 1); }
    else if (/^[0-6]$/.test(e.key)) go(+e.key);
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(last);
  });
  document.querySelectorAll('#arch-steps li').forEach((li, i) => li.addEventListener('click', e => { e.stopPropagation(); go(i); }));
  document.getElementById('stage').addEventListener('click', () => go(step + 1));

  function fit() {
    const s = Math.min(innerWidth / 1280, innerHeight / 720);
    document.getElementById('stage').style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  addEventListener('resize', fit);
  fit();
  render();

  const laptop = "http://127.0.0.1:8080/debug/last-ask";
  const liveEl = document.getElementById("live");
  const liveQ = document.getElementById("live-q");
  const laptopSub = document.getElementById("laptop-sub");
  let seenAt = null;

  function trunc(s, n) {
    s = (s || "").replace(/\s+/g, " ").trim();
    return s.length > n ? s.slice(0, n - 1) + "…" : s;
  }

  async function pollLaptop() {
    try {
      const r = await fetch(laptop);
      const j = await r.json();
      const on = j.served_by === "laptop" && j.question;
      liveOn = !!on;
      liveEl.classList.toggle("on", liveOn);
      if (on) {
        liveQ.textContent = j.question;
        laptopSub.textContent = trunc(j.question, 26);
        if (j.at !== seenAt) {
          seenAt = j.at;
          liveEl.style.outline = "2px solid var(--mirrord)";
          setTimeout(() => { liveEl.style.outline = ""; }, 800);
        }
      } else {
        liveQ.textContent = "";
        laptopSub.textContent = "your local code";
      }
      render();
    } catch {
      liveOn = false;
      liveEl.classList.remove("on");
      laptopSub.textContent = "your local code";
      render();
    }
  }
  pollLaptop();
  setInterval(pollLaptop, 1000);
</script>
</body>
</html>
